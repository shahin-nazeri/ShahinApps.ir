<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرورگر شاهین | Shahin Browser</title>
    <!-- اتصال فونت بسیار زیبای وزیرمتن (Vazirmatn) از گوگل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            /* اعمال فونت حرفه‌ای وزیرمتن به کل صفحه */
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 2.2rem;
            font-weight: 800;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
            font-weight: 400;
        }
        .download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--primary);
            color: white;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .download:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .download-sub {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-top: 4px;
            font-weight: 400;
        }
        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اینجا می‌توانی متن‌ها یا لوگوی خودت را داشته باشی -->
        <h1 style="color: #60a5fa;">مرورگر شاهین</h1>
        <p>سریع، امن و مدرن برای تجربه‌ای متفاوت در وب.</p>
        
        <!-- لینک دکمه دانلود مستقیم گیت‌هاب -->
        <a class="download" download="ShahinBrowser.exe" href="https://github.com/shahin-nazeri/ShahinApps.ir/releases/download/v1.0.0/ShahinBrowser.exe" id="downloadBtn">
            <span>
                <span>دانلود مرورگر شاهین</span>
                <span class="download-sub">برای ویندوز ۱۰ و ۱۱ (۱۳۳ مگابایت)</span>
            </span>
        </a>
    </div>

    <footer>
        © برنامه‌های شاهین. تمامی حقوق محفوظ است.
    </footer>

</body>
</html>
