<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<!-- تایید مالکیت گوگل سرچ کنسول -->
<meta name="google-site-verification" content="GAPGPTMASKTOKENmiuzagik9nX1X" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<title>مرورگر شاهین | Shahin Browser</title>
<style>
:root {
  --bg: #070b1b;
  --bg-card: rgba(18, 27, 56, 0.65);
  --blue: #2878ff;
  --purple: #7645f5;
  --accent: #00f2fe;
  --text: #f3f4f6;
  --text-muted: #9ca3af;
  --yellow: #ffd34e;
  --border: rgba(255, 255, 255, 0.1);
}

/* Mobile and Safari text visibility fixes */
body {
  margin: 0;
  padding: 0;
  font-family: 'Vazirmatn', Tahoma, 'Segoe UI', Arial, sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(circle at 50% 20%, rgba(40, 120, 255, 0.15), transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(118, 69, 245, 0.1), transparent 40%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

@supports not (-webkit-background-clip: text) {
  .gradient-text {
    color: var(--blue);
  }
}

.container {
  width: 100%;
  max-width: 600px;
  padding: 2rem;
  box-sizing: border-box;
  text-align: center;
}

.topbar {
  position: absolute;
  top: 1.5rem;
  left: 1.5rem;
  display: flex;
  gap: 0.5rem;
  background: var(--bg-card);
  padding: 0.35rem;
  border-radius: 9999px;
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
}

.lang-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 0.4rem 0.8rem;
  border-radius: 9999px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.2s ease;
}

.lang-btn img {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: cover;
}

.lang-btn.active {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff;
  box-shadow: 0 4px 12px rgba(40, 120, 255, 0.3);
}

.logo {
  width: 90px;
  height: 90px;
  margin-bottom: 1.5rem;
  filter: drop-shadow(0 0 20px rgba(40, 120, 255, 0.4));
}

.headline {
  font-size: 2.25rem;
  font-weight: 800;
  margin: 0 0 1rem 0;
  line-height: 1.3;
  letter-spacing: -0.025em;
}

.headline span {
  background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 1.05rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
  line-height: 1.6;
}

.download-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 1.25rem;
  padding: 2rem;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.download-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  width: 100%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff;
  text-decoration: none;
  padding: 1rem 1.5rem;
  border-radius: 0.85rem;
  font-weight: 700;
  font-size: 1.1rem;
  box-shadow: 0 8px 25px rgba(40, 120, 255, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-sizing: border-box;
}

.download-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(40, 120, 255, 0.6);
}

.download-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.download-info {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: right;
}

.download-info span:first-child {
  font-size: 1.1rem;
}

.download-info span:last-child {
  font-size: 0.75rem;
  opacity: 0.8;
  font-weight: 400;
}

[dir="ltr"] .download-info {
  text-align: left;
}

.warning {
  margin-top: 1.25rem;
  background: rgba(255, 211, 78, 0.08);
  border: 1px solid rgba(255, 211, 78, 0.2);
  color: var(--yellow);
  padding: 0.75rem 1rem;
  border-radius: 0.75rem;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

footer {
  margin-top: 3rem;
  font-size: 0.8rem;
  color: var(--text-muted);
  opacity: 0.7;
}

@media(max-width: 520px) {
  .container {
    padding: 1.25rem;
  }
  .headline {
    font-size: 1.75rem;
  }
  .topbar {
    top: 1rem;
    left: 1rem;
  }
}
</style>
</head>
<body>

  <header class="topbar" aria-label="Language selection">
    <button id="faBtn" class="lang-btn active" onclick="setLang('fa')" data-en="Persian" data-fa="فارسی">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'><rect width='600' height='133.3' fill='%23239f40'/><rect y='133.3' width='600' height='133.3' fill='%23fff'/><rect y='266.6' width='600' height='133.4' fill='%23da0000'/></svg>" alt="Iran flag">
      فارسی
    </button>
    <button id="enBtn" class="lang-btn" onclick="setLang('en')" data-en="English" data-fa="انگلیسی">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'><rect width='60' height='30' fill='%23012169'/><path d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/><path d='M0,0 L60,30 M60,0 L0,30' stroke='%23C8102E' stroke-width='4'/><path d='M30,0 V30 M0,15 H60' stroke='%23fff' stroke-width='10'/><path d='M30,0 V30 M0,15 H60' stroke='%23C8102E' stroke-width='6'/></svg>" alt="UK flag">
      English
    </button>
  </header>

  <main class="container">
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><circle cx='64' cy='64' r='60' fill='%23121b38' stroke='%232878ff' stroke-width='4'/><path d='M40 64 L88 40 L72 88 L60 72 Z' fill='url(%23grad)'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%232878ff'/><stop offset='100%25' stop-color='%237645f5'/></linearGradient></defs></svg>" alt="لوگوی پرندهٔ شاهین" class="logo">
    
    <h1 class="headline"><span data-en="Shahin Apps" data-fa="برنامه های شاهین">برنامه های شاهین</span></h1>
    <p class="subtitle" data-en="A fast, secure, modern browser for a better internet experience" data-fa="مرورگری سریع، امن و مدرن برای تجربه‌ای بهتر در دنیای وب">مرورگری سریع، امن و مدرن برای تجربه‌ای بهتر در دنیای وب</p>
    
    <div class="download-box">
      <a href="https://github.com/shahin-nazeri/ShahinApps.ir/releases/download/v1.0.0/ShahinBrowser.exe" class="download-btn" id="downloadBtn" download="ShahinBrowser.exe">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <div class="download-info">
          <span data-en="Download Shahin Browser" data-fa="دانلود مرورگر شاهین">دانلود مرورگر شاهین</span>
          <span data-en="For Windows 10 & 11" data-fa="برای ویندوز ۱۰ و ۱۱">برای ویندوز ۱۰ و ۱۱</span>
        </div>
      </a>
      
      <div class="warning">
        <svg style="width:18px;height:18px;fill:currentColor;flex-shrink:0" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span data-en="Windows 8.1, 8, 7 and XP are not supported." data-fa="از ویندوزهای ۸.۱، ۸، ۷ و XP پشتیبانی نمی‌گردد.">از ویندوزهای ۸.۱، ۸، ۷ و XP پشتیبانی نمی‌گردد.</span>
      </div>
    </div>
    
    <footer>
      <span data-en="© Shahin Apps. All rights reserved." data-fa="برنامه های شاهین. تمامی حقوق محفوظ است.">برنامه های شاهین. تمامی حقوق محفوظ است.</span>
    </footer>
  </main>

  <script>
    function setLang(lang) {
      const html = document.documentElement;
      html.lang = lang;
      html.dir = lang === 'fa' ? 'rtl' : 'ltr';
      
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
      
      document.getElementById('faBtn').classList.toggle('active', lang === 'fa');
      document.getElementById('enBtn').classList.toggle('active', lang === 'en');

      document.title = lang === 'fa' ? 'مرورگر شاهین | Shahin Browser' : 'Shahin Browser | مرورگر شاهین';
    }
  </script>
</body>
</html>
