<style>
:root{--bg:#070b1b;--panel:#0d1530;--blue:#2878ff;--purple:#7645f5;--text:#f7f8ff;--muted:#b9c5e3;--yellow:#ffd34e;--line:#25345c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Vazirmatn', Tahoma, 'Segoe UI', Arial, sans-serif;background:radial-gradient(ellipse at 50% 15%,#14295a 0%,#090f25 42%,var(--bg) 78%);color:var(--text)}
body{min-height:100vh;display:flex;flex-direction:column}.topbar{height:86px;display:flex;align-items:center;justify-content:flex-end;padding:18px clamp(18px,5vw,70px);border-bottom:1px solid rgba(120,150,220,.2)}
.langs{display:flex;gap:10px;align-items:center}.lang{border:1px solid #334879;background:#0b1430;color:#f8faff;border-radius:28px;padding:10px 16px;display:flex;gap:9px;align-items:center;cursor:pointer;font-size:15px;transition:.2s}.lang:hover,.lang.active{border-color:#4d8fff;background:#152653;box-shadow:0 0 20px #226eff25}.flag{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;font-size:17px;flex:none}.lionflag{width:24px;height:24px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
main{width:min(900px,100%);margin:auto;padding:58px 22px 65px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1}.logo{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 0 50px #4b5dff50;margin-bottom:27px;border:1px solid #ffffff1c}.headline{font-size:clamp(34px,5.6vw,62px);font-weight:900;line-height:1.35;letter-spacing:-1.4px;margin:0;max-width:800px}.headline .accent{background:linear-gradient(100deg,#31baff,#6680ff 55%,#bb75ff);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{font-size:clamp(16px,2.1vw,21px);line-height:1.9;color:var(--muted);margin:18px 0 32px;max-width:690px}.download{display:flex;align-items:center;justify-content:center;gap:14px;min-width:min(440px,100%);padding:17px 28px;border-radius:17px;color:white;text-decoration:none;font-weight:800;font-size:20px;background:linear-gradient(110deg,#0869f7,#5947f5);border:1px solid #5e9dff;box-shadow:0 10px 35px #135eff38;transition:transform .2s,filter .2s}.download:hover{transform:translateY(-2px);filter:brightness(1.1)}.windows{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none}.windows svg{width:36px;height:36px;display:block;filter:drop-shadow(0 1px 2px #003b99)}.download-sub{display:block;font-size:14px;font-weight:500;opacity:.92;margin-top:6px}.warning{width:min(570px,100%);margin-top:22px;padding:15px 18px;border:1px solid #f4c640;border-right:4px solid var(--yellow);border-radius:12px;background:#30281145;color:#fff3bf;display:flex;align-items:center;gap:12px;text-align:start;line-height:1.9;font-size:14px}.warning-icon{display:flex;align-items:center;justify-content:center;background:var(--yellow);color:#241c00;width:27px;height:27px;border-radius:50%;font-weight:900;flex:none}footer{border-top:1px solid rgba(120,150,220,.2);padding:22px 18px;text-align:center;color:#aab7d6;font-size:14px;background:#0509188c}footer span{color:#e5eaff}@media(max-width:520px){.topbar{height:72px;justify-content:center;padding:12px}.lang{padding:9px 12px;font-size:14px}.logo{width:94px;height:94px}.download{min-width:0;width:100%;font-size:18px}.warning{font-size:13px}}

/* Mobile and Safari text visibility fixes */
.headline .accent{color:#8fb2ff;-webkit-text-fill-color:transparent}
@supports not (-webkit-background-clip:text){
  .headline .accent{color:#8fb2ff;background:none}
}
@media(max-width:520px){
  body{min-height:100svh}
  main{padding:34px 18px 42px;gap:0}
  .headline{font-size:clamp(30px,8vw,42px);line-height:1.45;letter-spacing:0;overflow-wrap:anywhere}
  .subtitle{font-size:16px;line-height:1.85;margin:16px 0 26px}
  .download{white-space:normal;line-height:1.5;padding:15px 14px}
  .warning{line-height:1.85;overflow-wrap:anywhere}
  footer{line-height:1.8}
}
</style></head>
